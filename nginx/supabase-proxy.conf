# Shared by the domain and IP HTTPS virtual hosts.
location ^~ /supabase/ {
    # The trailing slash strips /supabase/ while preserving the query string.
    proxy_pass https://ctffjscvkspyqnihvetf.supabase.co/;
    proxy_http_version 1.1;
    proxy_set_header Host ctffjscvkspyqnihvetf.supabase.co;
    proxy_set_header Connection "";

    proxy_ssl_server_name on;
    proxy_ssl_name ctffjscvkspyqnihvetf.supabase.co;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream off;
    proxy_cache off;
    client_max_body_size 20m;

    # Login query strings contain password hashes; don't write access logs here.
    access_log off;
}
